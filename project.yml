name: LightData

options:
  bundleIdPrefix: com.zyli
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  LightDataCore:
    path: LightDataCore
  # Same repo LightDataCore already depends on (SPM dedupes); referenced directly so
  # the app tests can generate Parquet fixtures.
  duckdb-swift:
    url: https://github.com/duckdb/duckdb-swift
    from: "1.0.0"

targets:
  LightData:
    type: application
    platform: macOS
    sources:
      - App
      - path: LightDATA.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: LightDataCore
        product: LightDataCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyli.LightData
        PRODUCT_NAME: LightData
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: LightDATA
        # Programmatic AppKit entry point (App/main.swift); no storyboard.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  # Integration tests hosted INSIDE the real app process: they drive actual
  # MainWindowController instances (real windows, real undo stack, real files)
  # so regressions in editing/undo/close flows are caught without manual testing.
  LightDataAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: LightData
      - package: LightDataCore
        product: LightDataCore
      - package: duckdb-swift
        product: DuckDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LightData.app/Contents/MacOS/LightData
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic

schemes:
  LightData:
    build:
      targets:
        LightData: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LightDataAppTests
